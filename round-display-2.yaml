# Board: ESP32-2424S012 Round CYD 1.28" (Guition)
# Definition: definitions/boards/esp32-2424s012/manifest.yaml

esphome:
  name: round-display-2
  friendly_name: Round Display 2

esp32:
  variant: esp32c3
  flash_size: 4MB
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Round Display 2 Fallback Hotspot
    password: "P3EbPRg2gGTG"

captive_portal:

spi:
  - id: lcd_spi
    clk_pin: 6
    mosi_pin: 7

display:
  - platform: mipi_spi
    id: lcd_display
    spi_id: lcd_spi
    model: ESP32-2424S012
    cs_pin: 10
    dc_pin:
      ignore_strapping_warning: true
      number: 2
    show_test_card: true

output:
  - platform: ledc
    id: backlight_output
    pin: 3
    frequency: 1000Hz

light:
  - platform: monochromatic
    name: Display Backlight
    id: display_backlight
    icon: "mdi:brightness-7"
    restore_mode: ALWAYS_ON
    output: backlight_output

i2c:
  - id: i2c_bus
    scl: 5
    sda: 4
    scan: true

touchscreen:
  - platform: cst816
    id: lcd_touch
    i2c_id: i2c_bus
    display: lcd_display
    interrupt_pin: 0
    reset_pin: 1
