.base_swipe_actions: &page_swipes
  on_swipe_left:
    then:
      - script.execute: page_next_alt
      - script.execute: pause_page_turn
  on_swipe_right:
    then:
      - script.execute: page_prev_alt
      - script.execute: pause_page_turn

.base_press_actions: &page_press
  on_press:
    then:
      - script.execute: pause_page_turn

lvgl:
  displays:
    - my_display
  buffer_size: 25%
  # rotation: 90

  theme:
    buttonmatrix:
      bg_opa: TRANSP
      border_color: 0x0077b3
      border_width: 0
      text_color: 0xFFFFFF
      pad_all: 0
      items: # set all your buttonmatrix buttons to use your custom defined styles and font
        bg_color: 0x2F8CD8
        bg_grad_color: 0x005782
        bg_grad_dir: VER
        bg_opa: COVER
        border_color: 0x0077b3
        border_width: 1
        text_color: 0xFFFFFF
        pressed:
          bg_color: 0x006699
          bg_grad_color: 0x00334d
        checked:
          bg_color: 0x1d5f96
          bg_grad_color: 0x03324A
          text_color: 0x005580


  style_definitions:
    - id: header_style
      # bg_color: my_yellow #0x000000 #0xffffff
      # text_color: 0xffffff #0x000000
      text_font: ${font2} 
      width: 100%
      y: 0
      pad_all: 1
      height: ${"30" if is480x320 else "25"}
      border_width: 0
      radius: 0

    - id: main_widget_style
      # bg_color: my_black #0x000000  #0xddddFF
      # text_color: my_red #0x2596be      
      # border_color: 0xddddFF #0x000000
      border_width: 2
      radius: 0
      x: -2 #border_width
      y: ${"32" if is480x320 else "27"}
      width: ${display_width + 2*2}
      height: ${(display_height - 57) if is480x320 else (display_height - 27)} #height: ${(display_height - 57) if is480x320 else (display_height - 50)}
      scrollbar_mode: "OFF"

    - id: subwidget_style
      # bg_color: my_orange  #0xddddFF
      # text_color: my_red #0x2596be      
      # border_color: 0xddddFF
      # border_width: 4


  top_layer:
    widgets:
      - obj:
          styles: header_style
          align: top_left
          bg_opa: TRANSP
          scrollbar_mode: "OFF"
          
          layout: # enable the FLEX layout for the child widgets
            type: flex
            flex_flow: ROW_WRAP
            flex_align_cross: start
            flex_align_main: start
            pad_column: 1

          widgets:
            - image:
                src: washing_machine_small
                id: icon_wash
                image_recolor: my_red
                image_recolor_opa: cover
            - image:
                src: dryer_small
                id: icon_dryer
                image_recolor: my_blue
                image_recolor_opa: cover
            - image:
                src: dishwasher_icon_small
                id: icon_dishwasher
                image_recolor: my_green
                image_recolor_opa: cover
      - obj:
          styles: header_style
          align: top_right
          bg_opa: TRANSP
          layout: # enable the FLEX layout for the child widgets
            type: flex
            flex_flow: ROW_WRAP
            flex_align_cross: end
            flex_align_main: end
            pad_column: 1
          widgets:
            - label:
                text: "\uf1eb"
                text_font: ${font1} 
                id: lbl_hastatus
                hidden: true
                align: top_right
                text_align: right
                pad_right: 5
      - obj:
          id: boot_screen
          x: 0
          y: 0
          width: 100%
          height: 100%
          bg_color: 0x000000
          bg_opa: COVER
          radius: 0
          pad_all: 0
          border_width: 0
          widgets:
            - image:
                align: CENTER
                src: boot_logo
                y: ${"-40" if is480x320 else "-25"}
            - spinner:
                align: CENTER
                y: ${"95" if is480x320 else "81"}
                height: ${"50" if is480x320 else "38"}
                width: ${"50" if is480x320 else "38"}
                spin_time: 1s
                arc_length: 60deg
                arc_width: ${"8" if is480x320 else "6"}
                indicator:
                  arc_color: 0x18bcf2
                  arc_width: 8
          on_press:
            - lvgl.widget.hide: boot_screen

  
  pages:
    - id: outside_page
      <<: *page_swipes


      widgets:
      - obj:
          align: TOP_MID
          styles: header_style
          widgets:
            - label:
                text: "Outside Conditions"
                align: CENTER
                text_align: CENTER
      - obj:
          styles: main_widget_style
          <<: *page_press
          layout: # enable the FLEX layout for the children widgets
            type: flex
            flex_flow: ROW_WRAP
            flex_align_cross: CENTER
            flex_align_main: CENTER
          text_font: ${font3} 

          scrollbar_mode: "OFF"
          widgets:
            - label:
                text: "Temperature/Humidity"                
                width: 100%
            - label:
                text: "x"
                text_align: center
                text_font: ${font5} 
                width: ${"49%" if is480x320 else "40%"}
                id: outside_temperature_lbl
            - label:
                text: "y"
                text_align: center
                text_font: ${font5} 
                width: ${"49%" if is480x320 else "40%"}
                id: outside_humidity_lbl
            - label:
                text: "Pool Temperature"
                width: 100%
            - label:
                text: "-"
                text_align: center
                text_font: ${font5} 
                width: 100%
                id: pool_temperature_lbl


    - id: dogfeed_page
      <<: *page_swipes

      widgets:
      - obj:
          align: TOP_MID
          styles: header_style
          widgets:
            - label:
                text: "Dog Feeding"
                align: CENTER
                text_align: CENTER
      - obj:
          styles: main_widget_style
          <<: *page_press
          layout: # enable the FLEX layout for the children widgets
            type: flex
            flex_flow: ROW_WRAP
            flex_align_cross: CENTER
            flex_align_main: CENTER
            pad_column: 5
          text_font: ${font4} 
          widgets:
            - label:
                id: storm_fed
                text: "Storm Last Fed: "
                width: 100%
            - image:
                src: dogbowl2
                id: dog1_1
            - image:
                src: dogbowl2
                id: dog1_2
            - image:
                src: dogbowl2
                id: dog1_3
            - label:
                id: dog1_plus
                text: "+ (n)"
            - label:
                id: dusty_fed
                text: "Dusty Last Fed: "
                width: 100%
            - image:
                src: dogbowl2
                id: dog2_1
            - image:
                src: dogbowl2
                id: dog2_2
            - image:
                src: dogbowl2
                id: dog2_3
            - label:
                id: dog2_plus
                text: "+ (n)"
    - id: dishwasher_page
      <<: *page_swipes
      widgets:
      - obj:
          align: TOP_MID
          styles: header_style
          widgets:
            - label:
                text: "Dishwasher"
                align: CENTER
                text_align: CENTER
      - obj:
          styles: main_widget_style
          <<: *page_press
          layout: # enable the FLEX layout for the children widgets
            type: flex
            flex_flow: ROW_WRAP
            flex_align_cross: CENTER
            flex_align_main: CENTER
          text_font: ${font4} 

          scrollbar_mode: "OFF"
          widgets:

                - label:
                    id: dishwasher_lastrun_lbl
                    text: "Last Run: "
                    width: 100%
                - obj:
                    width: 100%
                    height: ${210 if is480x320 else 150} #height of the largest widget
                    styles: subwidget_style
                    scrollbar_mode: "OFF"
                    scrollable: "OFF"          
                    widgets:

                    - image:
                        align: CENTER
                        src: dishwasher_icon
                        id: dish_1
                        image_recolor: my_green
                        image_recolor_opa: cover
                    - label:
                        align: CENTER
                        id: dishwasher_progress_lbl
                        text: "Progress..."
                        bg_opa: 75%
                        pad_all: ${15 if is480x320 else 11}
                        radius: 5
                        border_width: 2
                    - buttonmatrix:
                        y: ${60 if is480x320 else 43}
                        align: CENTER
                        width: ${220 if is480x320 else 256}
                        height: ${40 if is480x320 else 28}
                        
                        id: dishwasher_buttons
                        one_checked: true                           

                        rows:
                          - buttons:                              
                            - id: button_1
                              text: "Dirty?"
                              control:
                                checkable: false
                              on_press:
                                then:
                                  - homeassistant.action:
                                      action: input_select.select_option
                                      data:
                                        entity_id: input_select.dishwasher_status
                                        option: Dirty
                                  - lvgl.widget.hide: dishwasher_buttons
                                  
                            - id: button_2                              
                              text: "Clean?"
                              control:
                                checkable: false
                              on_press:
                                then:
                                  - homeassistant.action:
                                      action: input_select.select_option
                                      data:
                                        entity_id: input_select.dishwasher_status
                                        option: Clean
                                  - lvgl.widget.hide: dishwasher_buttons

    - id: media_info_page
      <<: *page_swipes
      skip: true
      widgets:
      - obj:
          align: TOP_MID
          styles: header_style
          widgets:
            - label:
                text: "Now Playing"
                align: CENTER
                text_align: CENTER
      - obj:
          styles: main_widget_style
          <<: *page_press
          layout: # enable the FLEX layout for the children widgets
            type: flex
            flex_flow: ROW_WRAP
            flex_align_cross: CENTER
            flex_align_main: CENTER
           


          widgets:
            - label:
                text: "-"
                text_align: center
                text_font: ${font5}
                width: 100%
                id: track_title_lbl
            - label:
                text: "x"
                text_align: center
                text_font: ${font4a}
                width: 100%
                id: artist_name_lbl








    - id: green_egg_page
      <<: *page_swipes
      widgets:
      - obj:
          align: TOP_MID
          styles: header_style
          widgets:
            - label:
                text: "Big Green Egg"
                align: CENTER
                text_align: CENTER
      - obj:
          styles: main_widget_style
          <<: *page_press
          layout: # enable the FLEX layout for the children widgets
            type: flex
            flex_flow: ROW_WRAP
            flex_align_cross: CENTER
            flex_align_main: CENTER
          text_font: ${font3} 
          bg_color: my_green

          scrollbar_mode: "OFF"
          widgets:
            - label:
                text: "Cook Temperature"
                text_color: my_white
                width: 100%
            - label:
                text: "x"
                text_align: center
                text_font: ${font5} 
                text_color: my_yellow
                width: 100%
                id: cook_temperature_lbl
            - label:
                text: "Probe Temperatures"
                text_color: my_white
                width: 100%
            - label:
                text: "x"
                text_align: center
                text_font: ${font4a} 
                text_color: my_yellow
                width: ${"32%" if is480x320 else "30%"}
                id: probe1_lbl
            - label:
                text: "x"
                text_align: center
                text_font: ${font4a} 
                text_color: my_yellow
                width: ${"32%" if is480x320 else "30%"}
                id: probe2_lbl
            - label:
                text: "x"
                text_align: center
                text_font: ${font4a} 
                text_color: my_yellow
                width: ${"32%" if is480x320 else "30%"}
                id: probe3_lbl