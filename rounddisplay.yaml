sensor:
  - platform: homeassistant
    id: outside_temp
    entity_id: $weather
    on_value: 
      then:
        - lvgl.label.update:
            id: temp_widget
            text: 
              format: "%.1f°"
              args: [ 'id(outside_temp).get_state()' ]
  # - platform: homeassistant
  #   id: media_player_volume
  #   entity_id: $mediaplayer
  #   attribute: volume_level
  #   on_value:
  #     - lvgl.arc.update:
  #         id: volume_control_widget
  #         value: !lambda return (x * 100);

binary_sensor:
  - platform: template
    id: is_playing
    # lambda: 'return id(music_state).state == "playing";'
    filters:
      - delayed_off: 1300ms
    on_press:
      then:
        # - lvgl.page.show: media_player_page
    on_release:
      then:
        - lvgl.page.show: time_page

  - platform: homeassistant
    id: bed_chiller_state
    entity_id: $chiller
    on_state:
      then:
        - lvgl.widget.update:
            id: chiller_button
            state:
              checked: !lambda return x;
        - lvgl.label.update:
            id: chiller_button_label
            text: !lambda |-
              return x ? "ON" : "OFF";

script:
  - id: screentime
    mode: restart
    then:
      - light.turn_on: back_light
      - delay: $screensaver
      - light.turn_off: back_light
  - id: screenoff
    then:
      - script.stop: screentime
      - light.turn_off: back_light

output:
  - platform: ledc
    pin: $bkpin
    id: gpio_3_backlight_pwm

light:
  - platform: monochromatic
    output: gpio_3_backlight_pwm
    name: "Display Backlight"
    id: back_light
    restore_mode: ALWAYS_OFF
    on_turn_off: 
      then:
        - lvgl.pause:
            show_snow: true
    on_turn_on: 
      then:
        - lvgl.resume:

spi:
  mosi_pin: $mopin
  clk_pin: $clpin

i2c:
  sda: $sdapin
  scl: $sclpin
  scan: true
  id: ic_bus

display:
  - platform: ili9xxx
    model: GC9A01A
    id: watchface
    reset_pin: $tres
    cs_pin: $cspin
    # rotation: 180
    dc_pin: 
      number: $dcpin
      ignore_strapping_warning: true
    invert_colors: false

touchscreen:
  - platform: cst816
    id: touch
    interrupt_pin: $tint
    on_update:
      - script.execute: screentime
      # - lambda: |-
      #       for (auto touch: touches)  {
      #           if (touch.state <= 2) {
      #             ESP_LOGI("Touch points:", "id=%d x=%d, y=%d", touch.id, touch.x, touch.y);
      #           }
      #       }

lvgl:
  buffer_size: 25%
  rotation: 90
  top_layer:
    widgets:
      - label:
          id: time_widget
          align: CENTER
          y: 95
          text: 
            time_format: "%H:%m:%S"
            time: esptime
          on_short_click:
            then:
              - script.execute: screenoff
      - label:
          id: date_widget
          align: CENTER
          y: 80
          text: 
            time_format: "%A %b %d"
            time: esptime
          on_short_click:
            then:
              - script.execute: screenoff
  pages:
    - id: time_page
      widgets:
        - label:
            align: CENTER
            id: temp_widget
            # y: -100
            text_font: roboto36
            text: 
              format: "%.1f°"
              args: [ id(outside_temp).get_state() ]

    - id: bed_chiller_page
      widgets:
        - label:
            align: CENTER
            y: -85
            text_font: roboto18
            text: "Bed Chiller"
        # On/off button (checkable = stays pressed when ON)
        - button:
            id: chiller_button
            align: CENTER
            y: -10
            width: 120
            height: 70
            checkable: true
            widgets:
              - label:
                  id: chiller_button_label
                  align: CENTER
                  text_font: roboto36
                  text: "OFF"
            # Toggle the Home Assistant switch; the button state is then
            # confirmed/corrected by the bed_chiller_state binary_sensor above.
            on_short_click:
              then:
                - homeassistant.action:
                    action: switch.toggle
                    data:
                      entity_id: $chiller
        # Back to the main page
        - button:
            id: chiller_back_button
            align: CENTER
            y: 50
            width: 80
            height: 36
            widgets:
              - label:
                  align: CENTER
                  text_font: roboto18
                  text: "Back"
            on_short_click:
              then:
                - lvgl.page.show: time_page