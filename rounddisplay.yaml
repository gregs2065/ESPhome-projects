substitutions:
  devicename: round-display
  friendname: Round Display
  mediaplayer: media_player.home_theater # Replace with a suitable media player entity you want to control
  chiller_temp: input_number.bed_chiller_temp_greg # Bed chiller setpoint (70-90 F)
  light_prox: light.keypad_with_dimmer_49_f4_2e_main
  light_med: light.micro_dimmer_55_94_bd
  light_dist: light.keypad_dimmer_56_7b_21_main
  weather: sensor.outside_temp # Replace with a suitable weather entity from your home assistant
  chiller: input_boolean.bed_chiller_power_greg # Replace with the Home Assistant switch entity for your bed chiller
  screensaver: 5 min # Timeout for how long the screen should stay on after the last interaction
  sdapin: GPIO4
  sclpin: GPIO5
  tint: GPIO0
  tres: GPIO1
  dcpin: GPIO2
  bkpin: GPIO3
  clpin: GPIO6
  mopin: GPIO7
  cspin: GPIO10

esphome:
  name: $devicename
  friendly_name: $friendname
  on_boot: 
    - priority: -100
      then:
        - script.execute: screentime
        # Swipe down on the main page -> MBR lights page
        - lambda: |-
            lv_obj_add_event_cb(id(time_page)->obj, [](lv_event_t *e) {
              if (lv_indev_get_gesture_dir(lv_indev_get_act()) == LV_DIR_BOTTOM) {
                id(show_lights_page).execute();
              }
            }, LV_EVENT_GESTURE, nullptr);
        - lvgl.label.update:
              id: date_widget
              text: 
                time_format: "%A %b %d"
                time: esptime

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: .lan

logger:

font:
  - file: "gfonts://Roboto"
    id: roboto18
    size: 18
    glyphsets:
      - GF_Latin_Kernel
  - file: "gfonts://Roboto"
    id: roboto36
    size: 36
    glyphsets:
      - GF_Latin_Kernel
  - file: "gfonts://Roboto"
    id: roboto48
    size: 48
    glyphsets:
      - GF_Latin_Kernel

time:
  - platform: sntp
    timezone: "America/Toronto"
    id: esptime
    on_time:
      - cron: '* * * * * *'
        then:
          - lvgl.label.update:
              id: time_widget
              text_font: roboto48
              text: 
                time_format: "%l:%M:%S" # "%l:%M:%S %p"
                time: esptime
          - lvgl.label.update:
              id: date_widget
              text_font: roboto18
              text: 
                time_format: "%A %b %d"
                time: esptime

text_sensor:


sensor:
  - platform: homeassistant
    id: outside_temp
    entity_id: $weather
    on_value: 
      then:
        - lvgl.label.update:
            id: temp_widget
            text: 
              format: "%.1f°"
              args: [ 'id(outside_temp).get_state()' ]
  # Bed chiller setpoint from Home Assistant -> arc + readout
  - platform: homeassistant
    id: chiller_temp_sensor
    entity_id: $chiller_temp
    on_value:
      then:
        - lvgl.arc.update:
            id: chiller_arc
            value: !lambda return x;
        - lvgl.label.update:
            id: chiller_temp_label
            text:
              format: "%.0f°"
              args: [ 'x' ]
  # MBR light brightness (HA reports 0-255) -> sliders 0-100
  - platform: homeassistant
    id: light_prox_brightness
    entity_id: $light_prox
    attribute: brightness
    on_value:
      then:
        - lvgl.slider.update:
            id: prox_slider
            value: !lambda 'return std::isnan(x) ? 0 : (int) roundf(x * 100.0f / 255.0f);'
        - lvgl.label.update:
            id: prox_label
            text:
              format: "prox %.0f%%"
              args: [ 'std::isnan(x) ? 0.0f : roundf(x * 100.0f / 255.0f)' ]
  - platform: homeassistant
    id: light_med_brightness
    entity_id: $light_med
    attribute: brightness
    on_value:
      then:
        - lvgl.slider.update:
            id: med_slider
            value: !lambda 'return std::isnan(x) ? 0 : (int) roundf(x * 100.0f / 255.0f);'
        - lvgl.label.update:
            id: med_label
            text:
              format: "med %.0f%%"
              args: [ 'std::isnan(x) ? 0.0f : roundf(x * 100.0f / 255.0f)' ]
  - platform: homeassistant
    id: light_dist_brightness
    entity_id: $light_dist
    attribute: brightness
    on_value:
      then:
        - lvgl.slider.update:
            id: dist_slider
            value: !lambda 'return std::isnan(x) ? 0 : (int) roundf(x * 100.0f / 255.0f);'
        - lvgl.label.update:
            id: dist_label
            text:
              format: "dist %.0f%%"
              args: [ 'std::isnan(x) ? 0.0f : roundf(x * 100.0f / 255.0f)' ]
  # - platform: homeassistant
  #   id: media_player_volume
  #   entity_id: $mediaplayer
  #   attribute: volume_level
  #   on_value:
  #     - lvgl.arc.update:
  #         id: volume_control_widget
  #         value: !lambda return (x * 100);

binary_sensor:
  - platform: template
    id: is_playing
    # lambda: 'return id(music_state).state == "playing";'
    filters:
      - delayed_off: 1300ms
    on_press:
      then:
        # - lvgl.page.show: media_player_page
    on_release:
      then:
        - lvgl.page.show: time_page

  # Mirrors the real state of the bed chiller switch from Home Assistant,
  # so the on-screen button always matches reality (even if toggled elsewhere).
  - platform: homeassistant
    id: bed_chiller_state
    entity_id: $chiller
    on_state:
      then:
        - lvgl.widget.update:
            id: chiller_button
            state:
              checked: !lambda return x;
        - lvgl.label.update:
            id: chiller_button_label
            text: !lambda |-
              return std::string(x ? "ON" : "OFF");

  # MBR lights: on/off state, so the sliders drop to 0 when a light is turned off
  - platform: homeassistant
    id: light_prox_state
    entity_id: $light_prox
    on_state:
      then:
        - if:
            condition:
              lambda: 'return !x;'
            then:
              - lvgl.slider.update:
                  id: prox_slider
                  value: 0
              - lvgl.label.update:
                  id: prox_label
                  text: "prox 0%"
  - platform: homeassistant
    id: light_med_state
    entity_id: $light_med
    on_state:
      then:
        - if:
            condition:
              lambda: 'return !x;'
            then:
              - lvgl.slider.update:
                  id: med_slider
                  value: 0
              - lvgl.label.update:
                  id: med_label
                  text: "med 0%"
  - platform: homeassistant
    id: light_dist_state
    entity_id: $light_dist
    on_state:
      then:
        - if:
            condition:
              lambda: 'return !x;'
            then:
              - lvgl.slider.update:
                  id: dist_slider
                  value: 0
              - lvgl.label.update:
                  id: dist_label
                  text: "dist 0%"

script:
  # Set a light's brightness (0 = off). Called when a slider is released.
  - id: set_light
    mode: restart
    parameters:
      entity: string
      level: int
    then:
      - if:
          condition:
            lambda: 'return level > 0;'
          then:
            - homeassistant.action:
                action: light.turn_on
                data:
                  entity_id: !lambda 'return entity;'
                  brightness_pct: !lambda 'return to_string(level);'
          else:
            - homeassistant.action:
                action: light.turn_off
                data:
                  entity_id: !lambda 'return entity;'
  - id: show_lights_page
    then:
      - lvgl.page.show: mbr_lights_page
  - id: screentime
    mode: restart
    then:
      - light.turn_on: back_light
      - delay: $screensaver
      - light.turn_off: back_light
  - id: screenoff
    then:
      - script.stop: screentime
      - light.turn_off: back_light

output:
  - platform: ledc
    pin: $bkpin
    id: gpio_3_backlight_pwm

light:
  - platform: monochromatic
    output: gpio_3_backlight_pwm
    name: "Display Backlight"
    id: back_light
    restore_mode: ALWAYS_OFF
    on_turn_off: 
      then:
        - lvgl.pause:
            show_snow: true
    on_turn_on: 
      then:
        - lvgl.resume:

spi:
  mosi_pin: $mopin
  clk_pin: $clpin

i2c:
  sda: $sdapin
  scl: $sclpin
  scan: true
  id: ic_bus

display:
  - platform: ili9xxx
    model: GC9A01A
    id: watchface
    reset_pin: $tres
    cs_pin: $cspin
    # rotation: 180
    dc_pin: 
      number: $dcpin
      ignore_strapping_warning: true
    invert_colors: false

touchscreen:
  - platform: cst816
    id: touch
    interrupt_pin: $tint
    on_update:
      - script.execute: screentime
      # - lambda: |-
      #       for (auto touch: touches)  {
      #           if (touch.state <= 2) {
      #             ESP_LOGI("Touch points:", "id=%d x=%d, y=%d", touch.id, touch.x, touch.y);
      #           }
      #       }

lvgl:
  buffer_size: 25%
  rotation: 90
  pages:
    - id: time_page
      widgets:
        - label:
            align: CENTER
            id: time_widget
            # y: -100
            text_font: roboto48
            clickable: true
            text: 
              time_format: "%l:%M:%S" # "%l:%M:%S %p"
              time: esptime
            # Tap the time to open the bed chiller page
            on_short_click:
              then:
                - lvgl.page.show: bed_chiller_page
        - label:
            id: temp_widget
            align: CENTER
            y: 70
            text_font: roboto18
            text:               
              format: "%.1f°"
              args: [ id(outside_temp).get_state() ]
            on_short_click:
              then:
                - script.execute: screenoff
        - label:
            id: date_widget
            align: CENTER
            y: 40
            text_font: roboto18
            text: 
              time_format: "%A %b %d"
              time: esptime
            on_short_click:
              then:
                - script.execute: screenoff

    - id: bed_chiller_page
      widgets:
        # Setpoint arc (70-90 F) around the edge of the round display
        - arc:
            id: chiller_arc
            align: CENTER
            width: 225
            height: 225
            min_value: 70
            max_value: 90
            value: 70
            adjustable: true
            arc_width: 12
            indicator:
              arc_width: 12
            # Live readout while dragging
            on_value:
              then:
                - lvgl.label.update:
                    id: chiller_temp_label
                    text:
                      format: "%.0f°"
                      args: [ 'x' ]
            # Send to Home Assistant only when the finger is lifted
            on_release:
              then:
                - homeassistant.action:
                    action: input_number.set_value
                    data:
                      entity_id: $chiller_temp
                      value: !lambda 'return to_string(lv_arc_get_value(id(chiller_arc)));'
        - label:
            align: CENTER
            y: -70
            text_font: roboto18
            text: "Bed Chiller"
        - label:
            id: chiller_temp_label
            align: CENTER
            y: -35
            text_font: roboto36
            text: "--°"
        # On/off button (checkable = stays pressed when ON)
        - button:
            id: chiller_button
            align: CENTER
            y: 15
            width: 100
            height: 50
            checkable: true
            widgets:
              - label:
                  id: chiller_button_label
                  align: CENTER
                  text_font: roboto36
                  text: "OFF"
            # Toggle the Home Assistant switch; the button state is then
            # confirmed/corrected by the bed_chiller_state binary_sensor above.
            on_short_click:
              then:
                - homeassistant.action:
                    action: homeassistant.toggle
                    data:
                      entity_id: $chiller
        # Back to the main page
        - button:
            id: chiller_back_button
            align: CENTER
            y: 70
            width: 60
            height: 28
            widgets:
              - label:
                  align: CENTER
                  text_font: roboto18
                  text: "Back"
            on_short_click:
              then:
                - lvgl.page.show: time_page

    - id: mbr_lights_page
      widgets:
        # prox
        - label:
            id: prox_label
            align: CENTER
            y: -65
            text_font: roboto18
            text: "prox"
        - slider:
            id: prox_slider
            align: CENTER
            y: -45
            width: 150
            height: 14
            min_value: 0
            max_value: 100
            value: 0
            on_value:
              then:
                - lvgl.label.update:
                    id: prox_label
                    text:
                      format: "prox %.0f%%"
                      args: [ 'x' ]
            on_release:
              then:
                - script.execute:
                    id: set_light
                    entity: $light_prox
                    level: !lambda 'return lv_slider_get_value(id(prox_slider));'
        # med
        - label:
            id: med_label
            align: CENTER
            y: -15
            text_font: roboto18
            text: "med"
        - slider:
            id: med_slider
            align: CENTER
            y: 5
            width: 150
            height: 14
            min_value: 0
            max_value: 100
            value: 0
            on_value:
              then:
                - lvgl.label.update:
                    id: med_label
                    text:
                      format: "med %.0f%%"
                      args: [ 'x' ]
            on_release:
              then:
                - script.execute:
                    id: set_light
                    entity: $light_med
                    level: !lambda 'return lv_slider_get_value(id(med_slider));'
        # dist
        - label:
            id: dist_label
            align: CENTER
            y: 35
            text_font: roboto18
            text: "dist"
        - slider:
            id: dist_slider
            align: CENTER
            y: 55
            width: 150
            height: 14
            min_value: 0
            max_value: 100
            value: 0
            on_value:
              then:
                - lvgl.label.update:
                    id: dist_label
                    text:
                      format: "dist %.0f%%"
                      args: [ 'x' ]
            on_release:
              then:
                - script.execute:
                    id: set_light
                    entity: $light_dist
                    level: !lambda 'return lv_slider_get_value(id(dist_slider));'
        # Back to the main page
        - button:
            id: lights_back_button
            align: CENTER
            y: 92
            width: 60
            height: 28
            widgets:
              - label:
                  align: CENTER
                  text_font: roboto18
                  text: "Back"
            on_short_click:
              then:
                - lvgl.page.show: time_page